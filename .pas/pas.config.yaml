version: 1
project: diffscribe

state:
  root: .pas/state
  active: .pas/state/active
  archive: .pas/state/archive

features:
  directory: specs/features
  preserve_global_filenames: true
  gherkin_language: en

workflow:
  require_explicit_approval: true
  require_research_gate: true
  require_planning_gate: true
  max_retries_per_category: 2

memory:
  backend: mind
  space: projects/diffscribe

quality:
  required_commands:
    - npm run format
    - npm run lint
    - npm run check
    - npm run test:unit
    - npm run test:integration
    - npm run check:bdd-language
    - npm run test:bdd
    - npm run test:e2e
    - npm run build
